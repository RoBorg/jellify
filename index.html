<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn the subject of any photo into wobbly jelly. Runs entirely in your browser." />
    <title>Jellify</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍮</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">🍮</span>Jellify</h1>
      <div class="actions">
        <button id="settings-btn" class="btn" type="button" aria-expanded="false" aria-controls="settings" hidden>Settings</button>
        <button id="new-btn" class="btn btn-primary" type="button">Choose photo</button>
      </div>
    </header>

    <main id="stage" class="stage">
      <canvas id="view" class="view" hidden></canvas>

      <section id="intro" class="intro">
        <div class="drop">
          <p class="drop-title">Drop a photo here</p>
          <p class="drop-sub">or <button id="intro-btn" class="link" type="button">choose one</button>, or paste from the clipboard</p>
          <p class="drop-note">The main subject gets cut out and turned to jelly. Everything runs on your device; the first visit downloads about 8&nbsp;MB.</p>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="status-text"></span>
      </div>

      <p id="hint" class="hint" hidden>Drag it, shake the window, or shake your phone</p>

      <form id="settings" class="settings" hidden>
        <fieldset class="mode">
          <legend>Wobbliest part</legend>
          <label class="check"><input name="mode" type="radio" value="height" checked /> Top of the subject</label>
          <label class="check"><input name="mode" type="radio" value="depth" /> Nearest the camera <span class="note">(27&nbsp;MB depth model)</span></label>
        </fieldset>
        <label>Wobbliness <input name="wobble" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
        <label>Damping <input name="damping" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
        <label>Shake sensitivity <input name="sensitivity" type="range" min="0" max="2" step="0.01" value="1" /></label>
        <label class="check"><input name="hideJelly" type="checkbox" /> Hide jelly (show filled background)</label>
      </form>
    </main>

    <input id="file" type="file" accept="image/*" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
